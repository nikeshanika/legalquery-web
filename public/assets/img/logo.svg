<!-- LegalQuery Laws logo (design "L", owner 2026-11-25): scales in a gold laurel, for the navy header and footer.
     Animation "Hawa ka jhonka" (owner, 2026-11-26): every 6 s a gust of wind runs up both branches from the bottom;
     each leaf bends on its stalk (each leaf has its own angle) and blinks. Still for people who ask for reduced motion. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<style>
.leaf { fill:none; stroke:#c2a460; stroke-width:1.105; animation:gust 6s ease-in-out infinite; }
@keyframes gust {
  0%, 62%, 100% { transform:rotate(0deg); opacity:1; }
  70% { transform:rotate(calc(var(--a) * 2deg)); opacity:.55; }
  78% { transform:rotate(calc(var(--a) * -.8deg)); opacity:.9; }
  86% { transform:rotate(calc(var(--a) * .6deg)); opacity:.8; }
}
@media (prefers-reduced-motion: reduce) { .leaf { animation:none; } }
</style>
